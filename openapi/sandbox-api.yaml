  /v1/instances/{id}/file-transfers:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - $ref: '#/components/parameters/ResourceId'
    post:
      tags:
      - Files
      operationId: createFileTransfer
      summary: Create an admitted single-file transfer
      description: Requires files:write for UPLOAD or files:read for DOWNLOAD, plus
        instances:read and instances:hard_stop. If-Match is the instance ETag. Upload
        holds the exclusive writing slot while staging; downloads may run concurrently
        and prevent idle stopping. Tenant and project transfer-count and byte quotas
        are reserved. The 1..300 second deadline includes staging and is bounded by
        the compute lease. Timeout hard-stops the whole instance. Unknown outcomes never
        automatically redispatch. Staged content expires after 24 hours; bytes remain
        charged until every writer is known ended and physical objects are confirmed
        absent.
      responses:
        '202':
          description: Durable receipt. Poll operation and transfer; acceptance does
            not prove guest execution or VM termination.
          headers:
            ETag:
              $ref: '#/components/headers/SpecETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
