  "/v1/events/stream":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    get:
      tags:
      - Events
      operationId: streamEvents
      summary: Subscribe to resumable project domain-event metadata
      description: |
        Requires current events:read permission in project_id. instance_id uses the
        same visible-instance scope as GET /v1/events. Access tokens are accepted
        only in the Authorization header; query tokens and unknown parameters are
        rejected. Authorization is rechecked during the stream; a cursor is never
        an authorization capability.

        The first frame is stream.checkpoint with an id and decimal-string sequence.
        domain.event frames contain {sequence,event}, where event is EventRecord.
        Filtered positions advance with stream.checkpoint frames. Heartbeats are SSE
        comments about every 15 seconds and carry no id. Domain positions are commit
        ordered per project; occurred_at is not a stream ordering key. Delivery is
        at least once: deduplicate domain events by event.id, not cursor bytes.

        Last-Event-ID is the only resume parameter. Its signed opaque cursor is bound
        to the principal, tenant, project, optional instance, stream epoch and cluster
        epoch. Resume takes precedence over replay. Each issued cursor expires after
        24 hours. Do not use the list API cursor, edit/decode this value, or silently
        clear it after an error. Invalid/mismatched cursor returns 400 INVALID_CURSOR;
        an expired cursor returns 410 EVENT_CURSOR_EXPIRED; unavailable retained
        history or changed epoch returns 410 EVENT_HISTORY_UNAVAILABLE; an ahead
        cursor returns 409 EVENT_CURSOR_AHEAD. These require explicit reconciliation.

        JWT expiry, API shutdown or 300 seconds closes the connection. Obtain a fresh
        access token and reconnect from the last durably consumed cursor. After HTTP
        200, an error is event:stream.error with {code,retryable,request_id}, no id,
        followed by close. Never advance the cursor for an error or heartbeat. Use
        bounded jittered retry for retryable failures. Connection limits are enforced
        per replica (64 total, 16 per tenant, 4 per principal within tenant); rejection
        before streaming is HTTP 503 EVENT_STREAM_LIMIT.

        The 20-second management-response timeout does not bound this response body.
        Disable proxy buffering; preserve streaming and bounded idle timeouts. The
        TypeScript subscribeEvents helper provides bounded streaming rather than
        the normal SDK JSON-buffering transport. This stream contains sanitized
        metadata only, not guest output, audit payloads, or command parameters.
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: instance_id
        in: query
        schema:
          type: string
          format: uuid
      - name: replay
        in: query
        description: Initial position only when Last-Event-ID is absent.
        schema:
          type: string
          enum: [latest, all]
          default: latest
      - name: Last-Event-ID
        in: header
        description: Last durably consumed SSE id; must appear at most once.
        schema:
          type: string
          minLength: 1
          maxLength: 2048
      responses:
        '200':
          description: Bounded-lifetime Server-Sent Events stream, not a JSON document
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  SSE UTF-8 frames. stream.checkpoint data uses EventStreamCheckpoint;
                  domain.event data uses EventStreamDomainEvent; stream.error data
                  uses EventStreamFailure. id fields are opaque strings, not sequences.
              example: |
                event: stream.checkpoint
                id: opaque-signed-cursor
                data: {"sequence":"0"}

                : heartbeat

        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: EVENT_CURSOR_AHEAD requires explicit state/history reconciliation
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '410':
          description: EVENT_CURSOR_EXPIRED or EVENT_HISTORY_UNAVAILABLE; never auto-reset
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
