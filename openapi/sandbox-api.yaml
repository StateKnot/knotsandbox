      description: |
        Requires live workspaces:delete, including idempotent replay. The JSON
        confirm_workspace_id must exactly match the path UUID. A retained workspace
        with no retention_until may be explicitly deleted; active holds or a future
        retention deadline block acceptance. Busy or unresolved compute/volume
        safety also blocks deletion. The durable deletion tombstone cannot be
        cancelled or restored. A 202 receipt is acceptance, not proof that the disk
