    get:
      tags:
      - BrowserIdentity
      operationId: completeBrowserLogin
      summary: Consume a one-time bound challenge and exchange an authorization code
      security: []
      description: Browser binding cookie is required. Consumes and commits challenge
        before the single IdP request, verifies state/PKCE/nonce/signer/issuer/subject/audience
        and current tenant membership, then sets the opaque Secure/HttpOnly/Strict session
        cookie. Errors require a new login; code exchange is never retried. Query strings
        must not enter access logs or APM.
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      - name: error_description
        in: query
        required: false
        schema:
          type: string
      - name: session_state
        in: query
        required: false
        schema:
          type: string
      - name: iss
        in: query
        required: false
        schema:
          type: string
      responses:
