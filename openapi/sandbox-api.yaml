      parameters:
      - $ref: '#/components/parameters/FileTransferIfMatch'
      - name: Content-Length
        in: header
        required: true
        schema:
          type: integer
          minimum: 1
          maximum: 1048576
      - name: X-Content-SHA256
        in: header
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              maxLength: 1048576
  /v1/file-transfers/{id}/content/commit:
    parameters:
