              maxProperties: 0
  /v1/file-transfers/{id}/content:
    parameters:
    - $ref: '#/components/parameters/TenantId'
    - $ref: '#/components/parameters/ResourceId'
    get:
      tags:
      - Files
      operationId: downloadFileContent
      summary: Read retained verified download bytes
      description: Only FROZEN DOWNLOAD content. Requires files:read and instances:read,
        rechecked before and after each bounded OSS part read. Body lifetime is at most
