  "/v1/executions/{id}/output/stream":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    get:
      tags: [Executions]
      operationId: streamExecutionOutput
      summary: Stream verified committed output segments with a resumable cursor
      description: |
        Requires live executions:output:read, checked again after object I/O and
        before each data frame, together with JWT, principal, tenant and epoch.
        All query parameters are rejected. A fresh stream begins before segment 0;
        resume only with Last-Event-ID, bound to principal/tenant/execution/attempt
        and epoch. Never put tokens or offsets in the query string. Signed cursors
        expire after 24 hours; 409/410 require explicit reconciliation, never reset.

        First frame output.checkpoint carries {execution_id,after_segment}, where
        -1 precedes the first segment. output.segment carries {execution_id,segment}
        with consecutive segment.sequence and the existing Base64 output frames.
        output.end carries {execution_id,after_segment,output_status,manifest_verified,
        final_segment_sequence}; it ends this stream after all committed segments
        have been read. COMPLETE/TRUNCATED require a verified final manifest.
        PARTIAL/LOST remain incomplete; no end frame proves that the VM stopped.
        PENDING cannot produce an end frame. These three frame types have signed
        id cursors. Heartbeat comments every 15 seconds have no id. stream.error
        uses EventStreamFailure without id and then closes. Data is at most 768 KiB
        per SSE frame; clients may enforce a 1 MiB total frame ceiling.

        Delivery is at least once. Persist a yielded cursor only after processing
        that complete message; deduplicate by execution and segment sequence.
        Connections close at JWT expiry or after at most 300 seconds and must
        reconnect with refreshed credentials and the last consumed cursor. An
        output.end is terminal for this subscription and must not auto-reconnect.
        An initial stream loss before a checkpoint must be surfaced to the caller.
        Disable proxy buffering. Use subscribeExecutionOutput rather than the
        ordinary SDK JSON-buffering client. Guest bytes are not safe markup.
      parameters:
      - name: Last-Event-ID
        in: header
        schema:
          type: string
          minLength: 1
          maxLength: 2048
        description: Last durably consumed opaque cursor; at most one header value.
      responses:
        '200':
          description: Execution output Server-Sent Events, not a JSON document
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Accel-Buffering:
              schema:
                type: string
                const: 'no'
          content:
            text/event-stream:
              schema:
                type: string
                description: output.checkpoint uses OutputStreamCheckpoint, output.segment uses OutputStreamSegment, output.end uses OutputStreamEnd, stream.error uses EventStreamFailure.
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: OUTPUT_CURSOR_AHEAD; explicitly reconcile retained output.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '410':
          description: OUTPUT_CURSOR_EXPIRED or OUTPUT_HISTORY_UNAVAILABLE; never clear the cursor automatically.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '502':
          description: OUTPUT_INTEGRITY_FAILED is nonretryable even though the status is 502.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
  "/v1/executions/{id}/output":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    get:
      tags:
      - Executions
      operationId: getExecutionOutput
      summary: Read verified persisted output segments
      description: |
        Requires the independent executions:output:read grant. Tenant, project and
        principal authorization is checked before object reads and again before
        returning. The caller cannot supply an object key, bucket or URL. Each
        returned segment is checked against the committed database receipt for
        size, SHA-256, frame ordering, offsets and base64 data.

        after_segment is a zero-based segment position, not a frame number; -1
        reads from the start. At most two segments of at most 512 KiB are read in
        one page. has_more describes committed segments in this read snapshot.
        An empty PENDING page is not end-of-output; retain the prior position and
        query again later. manifest_verified validates the final manifest against
        the complete database index, not bytes of segments absent from this page.
        Only a verified manifest defines final_segment_sequence. Output remains
        untrusted guest data; render as text, never execute terminal escape codes
        or interpret it as markup without a suitable escaping boundary.

        The endpoint requires a separately configured read-only output identity.
        Missing configuration returns 503 OUTPUT_STORAGE_UNAVAILABLE and disables
        api_features.execution_output_download. This is bounded JSON pagination,
        not an SSE endpoint. A read never changes the activity slot or idle timer.
      parameters:
      - name: after_segment
        in: query
        schema:
          type: integer
          minimum: -1
          maximum: 4095
          default: -1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 2
          default: 1
      responses:
        '200':
          description: Verified page of committed output. Completeness is reported
            separately.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Content-Type-Options:
              "$ref": "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ExecutionOutputPage"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
