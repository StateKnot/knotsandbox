    - $ref: '#/components/parameters/ResourceId'
    - name: index
      in: path
      required: true
      schema:
        type: integer
        minimum: 0
        maximum: 99
    put:
      tags:
      - Files
      operationId: uploadFilePart
      summary: Submit one immutable part with a single OSS PUT attempt
      description: Requires files:write, instances:read and instances:hard_stop. If-Match
        is the transfer version. Content-Length and lowercase X-Content-SHA256 must
        match the body. A durable PUT identity precedes I/O. Stored exact parts may
        return a receipt without PUT; PUTTING/UNKNOWN parts cannot be resent. On an
        interrupted or failed response inspect transfer state; never automatically retry
        this data request. No Idempotency-Key is used.
      responses:
        '200':
          description: Exact acknowledgement; ETag equals transfer_version
          headers:
            ETag:
              $ref: '#/components/headers/SpecETag'
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePartAcknowledgement'
