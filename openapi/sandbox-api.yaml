  "/v1/workspaces/{id}/backups":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    post:
      tags: [Backups]
      operationId: createColdBackup
      summary: Accept an independently verified cold workspace backup
      description: |
        Requires live backups:create, including replay. If-Match covers the workspace
        spec_version from GET workspace. The instance must be STOPPED and all previous
        writers must have trusted termination and cleanup evidence. Acceptance reserves
        backup, temporary storage and isolated task resources and holds the workspace.
        A 202 is not a usable backup. CAPTURE and SEAL each require trusted VM closure;
        AVAILABLE additionally requires the independent vault inventory and certified
        immutable retention. Unknown results retain holds and quota. The profile is an
        operator-reviewed immutable configuration, never caller-supplied cloud credentials.
        Retry an ambiguous response with the same key, body and If-Match.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateBackup"
      responses:
        '202':
          description: Durable receipt; poll the operation and backup status.
          headers:
            X-Workspace-ETag:
              "$ref": "#/components/headers/SpecETag"
            Location:
              schema: {type: string, pattern: '^/v1/operations/[0-9a-f-]{36}$'}
            Retry-After:
              schema: {type: string, const: '2'}
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/BackupAccepted"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: Cold backup preconditions, active holds, profile certification or idempotency conflict.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '412':
          "$ref": "#/components/responses/VersionMismatch"
        '428':
          "$ref": "#/components/responses/PreconditionRequired"
        '429':
          description: Backup storage, temporary storage or isolated task resource quota exceeded.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
  "/v1/instances/{id}/diagnoses":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    post:
      tags: [Diagnostics]
      operationId: createDiagnosis
      summary: Create a durable read-only control-plane diagnosis
      description: |
        Requires live diagnoses:create and instances:read; included operation/execution
        evidence requires its respective read permission. Does not execute guest commands,
        acquire the instance activity slot, or modify its generation. Available in safe mode.
        One pending report per instance, 32 pending and 1000 admissions per rolling 24 hours
        per tenant. The worker has 120 seconds; report payload expires after 30 days.
        No If-Match is required. Target epoch/generation changes fail the report.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateDiagnosis"
      responses:
        '202':
          description: Durable report request and asynchronous operation.
          headers:
            ETag:
              "$ref": "#/components/headers/SpecETag"
            Location:
              schema: {type: string, pattern: '^/v1/operations/[0-9a-f-]{36}$'}
