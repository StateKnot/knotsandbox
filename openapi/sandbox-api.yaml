      description: Requires a current tenant-wide service_clients:read grant. Project-scoped
        authority is insufficient. Lists only this tenant; signed creation-time keyset
        cursor is bound to tenant, caller and limit for 24 hours. Includes disabled
        registrations. Concurrent status changes remain visible.
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 2048
      responses:
        '400': &11
          "$ref": "#/components/responses/BadRequest"
        '401': &12
          "$ref": "#/components/responses/Unauthenticated"
        '403': &13
          "$ref": "#/components/responses/Forbidden"
        '404': &14
          "$ref": "#/components/responses/NotFound"
        '503': &15
          "$ref": "#/components/responses/Unavailable"
        default: &16
          "$ref": "#/components/responses/Problem"
        '200':
          description: Authorized registration page
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ServiceClientPage"
    post:
      tags:
      - ServiceClients
      operationId: registerServiceClient
      summary: Register an existing OIDC service subject in this tenant
      description: Requires current tenant-wide service_clients:write. The API never
        creates an IdP account, issues tokens, stores client secrets or automatically
        grants permissions. New registrations accept only the deployment configured
        issuer. Existing SERVICE identity bindings may be reused across tenants, but
        cannot be rebound or matched by email. A tenant disable blocks old JWTs, idempotent
        replays by that disabled caller and new dispatch locally; other tenants are
        unaffected. Re-enable explicitly restores still-effective grants only when
        their scopes/actions/expiry remain within the restorer authority. A receipt
        replay does not restore current state. Audit and seven-day receipt commit
        atomically, with at least 90-day expired-key tombstones. Unknown or inaccessible
        registrations and incompatible global identity bindings return 404.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterServiceClient"
      responses:
        '400': *11
        '401': *12
        '403': *13
        '404': *14
        '503': *15
        default: *16
        '409':
          "$ref": "#/components/responses/Problem"
        '410':
          "$ref": "#/components/responses/Problem"
        '413':
          "$ref": "#/components/responses/Problem"
        '415':
          "$ref": "#/components/responses/Problem"
        '422':
          "$ref": "#/components/responses/Problem"
        '201':
