      operationId: commitFileUpload
      summary: Independently verify and freeze staged content
      description: Requires files:write, instances:read and instances:hard_stop. If-Match
        is the transfer ETag. Independently GET/HEAD every part, verify full byte length
        and SHA-256, then recheck identity, grants, epoch and deadline after I/O and
