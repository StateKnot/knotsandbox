components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT access token
      description: OAuth access token from the configured issuer; never an OIDC ID
        token.
    browserCookie:
      type: apiKey
      in: cookie
      name: __Host-sandbox-session
      description: Opaque product session; browsers never receive access or refresh tokens.
        Mutation additionally requires exact Origin and X-CSRF-Token.
  parameters:
    AutomationNotificationIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive notification.version from its
        detail GET; not the instance, automation or run version. Missing returns 428;
        a new key with a stale version returns 412. Replay retains the original precondition.
      schema:
        type: string
        pattern: ^"0*[1-9][0-9]*"$
    AutomationIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted positive AUTOMATION version; not the instance version. Retain original precondition
        on replay.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      description: Tenant selection UUID; the verified principal must have current
        product grants.
      schema:
        type: string
        format: uuid
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Persist and reuse the same key and body after an ambiguous submission
        result.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9_.:-]+$"
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive integer ETag from the latest
        instance read. Weak tags, lists and * are rejected. Missing header returns
        428; mismatched version returns 412. Replays with the original idempotency
        key use the original precondition.
      schema: &17
        type: string
        pattern: ^"0*[1-9][0-9]*"$
        example: '"1"'
    ExecutionIfMatch:
      name: If-Match
      in: header
      required: true
      description: Exactly one strong quoted positive execution version ETag from
        GET /v1/executions/{id}. This is not the instance ETag. Missing returns 428;
        mismatch returns 412. Retry with the original key/body/If-Match after ambiguous
        results.
      schema:
        type: string
        pattern: ^"0*[1-9][0-9]*"$
        example: '"1"'
    GrantId:
      name: grant_id
      in: path
      required: true
      schema: &18
        type: string
        format: uuid
    GrantIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted grant.version from a grant GET. Missing returns 428;
        stale returns 412. Retry a mutation using its original key, body and If-Match;
        a replay returns the original receipt version.
      schema: *17
    ServiceClientIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted service-client version from its GET. Missing returns
        428; stale returns 412. Retry with original key/body/If-Match after an ambiguous
        mutation.
      schema: *17
    FileTransferIfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted positive FileTransfer.version, from GET transfer or a
        part receipt. This is not the instance ETag.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  headers:
    AutomationNotificationETag:
      description: Strong quoted notification.version. Idempotent replay returns the
        original receipt version; read the notification for its current acknowledgement.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    RequestId:
      description: Server-generated UUID; matches Problem.request_id on error responses
      schema:
        type: string
        format: uuid
    NoStore:
      schema:
        type: string
        const: no-store
    NoSniff:
      schema:
        type: string
        const: nosniff
    SpecETag:
      description: Strong, quoted positive integer representing the resource specification
        version
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
        example: '"1"'
    ExecutionETag:
      description: Strong quoted execution.version. Idempotent replay returns the
        original receipt version; read the execution for current state.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
    InstanceETag:
      description: Strong quoted instance.spec_version after execution acceptance
        or cancellation.
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  responses:
    NoContent:
      description: Check passed, no response body
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Content-Type-Options:
          "$ref": "#/components/headers/NoSniff"
    Problem:
      description: |
        RFC 9457 error. All errors include no-store/nosniff and a matching
        X-Request-ID. 404 unknown routes and 405 unsupported methods also use
        this shape. retryable never authorizes a new idempotency key.
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Content-Type-Options:
          "$ref": "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    BadRequest:
      description: Malformed path/query/headers/JSON or invalid business parameters
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Unauthenticated:
      description: Missing, invalid, expired or unsupported access token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Forbidden:
      description: |
        Principal disabled/unregistered, insufficient local grants, or
        INSUFFICIENT_SCOPE. The scope error includes the Bearer challenge below;
        other permission denials do not include that challenge.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer error="insufficient_scope"
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    NotFound:
      description: Resource absent from the selected tenant's visible records
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    Unavailable:
      description: |
        IDENTITY_UNAVAILABLE, DEPENDENCY_UNAVAILABLE, PLATFORM_SAFE_MODE or
        REQUEST_TIMEOUT. Retry queries with backoff. For a mutation, retry
        acceptance only with its original idempotency key and identical body.
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    AcceptedMutation:
      description: Mutation accepted; runtime completion must be observed separately.
      headers:
        Location:
          description: Relative operation query URL
          schema:
            type: string
            example: "/v1/operations/00000000-0000-4000-8000-000000000001"
        ETag:
          "$ref": "#/components/headers/SpecETag"
        Retry-After:
          description: Suggested delay in seconds before checking the operation
          schema:
            type: string
            const: '2'
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Content-Type-Options:
          "$ref": "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Accepted"
    Renewed:
      description: Lease extension committed synchronously; operation.kind is RENEW
        and operation.status is SUCCEEDED.
      headers:
        Location:
          description: Relative operation query URL
          schema:
            type: string
            example: "/v1/operations/00000000-0000-4000-8000-000000000001"
        ETag:
          "$ref": "#/components/headers/SpecETag"
        Retry-After:
          description: Suggested delay in seconds before checking the operation
          schema:
            type: string
            const: '2'
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Content-Type-Options:
          "$ref": "#/components/headers/NoSniff"
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/Accepted"
    VersionMismatch:
      description: Current spec_version differs from If-Match; read the instance and
        make a new business decision.
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    PreconditionRequired:
      description: If-Match is required for this mutation.
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
      content:
        application/problem+json:
          schema:
            "$ref": "#/components/schemas/Problem"
    ExecutionAccepted:
      description: Durable execution or strong-cancellation receipt. This does not
        attest command execution or physical VM termination.
      headers:
        X-Request-ID:
          "$ref": "#/components/headers/RequestId"
        Cache-Control:
          "$ref": "#/components/headers/NoStore"
        X-Content-Type-Options:
          "$ref": "#/components/headers/NoSniff"
        ETag:
          "$ref": "#/components/headers/ExecutionETag"
        X-Instance-ETag:
          "$ref": "#/components/headers/InstanceETag"
        Location:
          description: Execution metadata route /v1/executions/{id}. The associated
            operation ID is in the body.
          schema:
            type: string
        Retry-After:
          schema:
            type: integer
            const: 2
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/AcceptedExecution"
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - detail
      - request_id
      - retryable
      properties:
        type:
          type: string
          format: uri
          example: urn:sandbox:error:unauthenticated
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          description: Stable machine-readable error code
        detail:
          type: string
          description: Human-readable message
          never parse for control flow:
        request_id:
          type: string
          format: uuid
        retryable:
          type: boolean
    CreateInstance:
      type: object
      additionalProperties: false
      required:
      - project_id
      - name
      - template_version_id
      - security_profile_id
      - flavor
      - workspace
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: "^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$"
        template_version_id:
          type: string
          format: uuid
        security_profile_id:
          type: string
          format: uuid
          description: Approved security_policy_versions record ID; the resolved ID
            appears as security_policy_version_id.
        flavor:
          type: string
          enum:
          - cpu1-mem2
          - cpu2-mem4
          - cpu4-mem8
        workspace:
          type: object
          additionalProperties: false
          required:
          - size_gib
          properties:
            size_gib:
              type: integer
              format: int64
              minimum: 20
              maximum: 1024
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 60
          maximum: 604800
          description: |
            Omitted/null uses the deployment default (normally 3600). The actual
            upper bound is the smaller deployment/project policy limit (deployment
            normally 86400). Acceptance starts the compute lease; it is not extended
            by request retries.
        client_reference:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Caller correlation value, without control characters; not an
            authorization or uniqueness key.
    Accepted:
      type: object
      required:
      - resource
      - operation
      - idempotency_expires_at
      properties:
        resource:
          "$ref": "#/components/schemas/Instance"
        operation:
          "$ref": "#/components/schemas/Operation"
        idempotency_expires_at:
          type: string
          format: date-time
    InstanceList:
      type: object
      required:
      - items
      - next_after
      properties:
        items:
          type: array
          maxItems: 100
          items:
            "$ref": "#/components/schemas/Instance"
        next_after:
          type:
          - string
          - 'null'
          format: uuid
    Instance:
      type: object
      required:
      - id
      - tenant_id
      - project_id
      - name
      - template_version_id
      - security_policy_version_id
      - workspace_id
      - desired_state
      - observed_state
      - spec_version
      - runtime_generation
      - active_operation_id
      - cpu_millis
      - memory_mib
      - compute_lease_id
      - compute_lease_version
      - compute_lease_started_at
      - compute_lease_expires_at
      - stop_reason
      - stop_accepted_at
      - observed_at
      - slot_held
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        template_version_id:
          type: string
          format: uuid
        security_policy_version_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        desired_state:
          type: string
          enum:
          - RUNNING
          - STOPPED
          - DELETED
        observed_state:
          type: string
          enum:
          - PENDING
          - STARTING
          - RUNNING
          - STOPPING
          - STOPPED
          - DELETING
          - DELETED
          - ERROR
          - UNKNOWN
          - QUARANTINED
        spec_version:
          type: integer
          format: int64
          minimum: 1
        runtime_generation:
          type: integer
          format: int64
          minimum: 1
        active_operation_id:
          type:
          - string
          - 'null'
          format: uuid
        cpu_millis:
          type: integer
          format: int64
          minimum: 1
        memory_mib:
          type: integer
          format: int64
          minimum: 1
        compute_lease_id:
          type: string
          format: uuid
        compute_lease_version:
          type: integer
          format: int64
          minimum: 1
        compute_lease_started_at:
          type: string
          format: date-time
        compute_lease_expires_at:
          type: string
          format: date-time
        stop_reason:
          type:
          - string
          - 'null'
          enum:
          - USER_REQUESTED
          - LEASE_EXPIRED
          - IDLE
          - EXECUTION_TIMEOUT
          - EXECUTION_CANCELLED
          - SECURITY
          - MAINTENANCE
          -
        stop_accepted_at:
          type:
          - string
          - 'null'
          format: date-time
        observed_at:
          type:
          - string
          - 'null'
          format: date-time
        slot_held:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Operation:
      type: object
      required:
      - id
      - tenant_id
      - project_id
      - instance_id
      - workspace_id
      - kind
      - status
      - stage
      - attempts
      - error
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        instance_id:
          type:
          - string
          - 'null'
          format: uuid
        workspace_id:
          type:
          - string
          - 'null'
          format: uuid
        kind:
          type: string
          description: Durable operation category. Acceptance does not establish runtime, deletion or backup completion.
          enum:
          - CREATE
          - START
          - STOP
          - RESTART
          - DELETE
          - RENEW
          - EXECUTE
          - DELETE_WORKSPACE
          - BACKUP
          - DIAGNOSE
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - WAITING
          - SUCCEEDED
          - FAILED
          - CANCELLED
        stage:
          type: string
          maxLength: 128
        attempts:
          type: integer
          format: int32
          minimum: 0
        error:
          oneOf:
          - type: 'null'
          - "$ref": "#/components/schemas/PublicOperationError"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StartInstance:
      type: object
      additionalProperties: false
      properties:
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 60
          maximum: 604800
          description: Omitted/null uses the deployment default. The actual maximum
            is the smaller project/deployment limit. A successful start creates a
            new compute lease.
    EmptyAction:
      type: object
      additionalProperties: false
      description: Send an explicit empty JSON object {}.
    RenewInstance:
      type: object
      additionalProperties: false
      required:
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
          description: Absolute expiry strictly after the current expiry, within the
            remaining-duration policy bound measured from database time. An expired
            or already-stopping lease cannot be renewed.
    CreateExecution:
      type: object
      additionalProperties: false
      required:
      - argv
      - public_env
      - cwd
      - timeout_seconds
      - output_limit_bytes
      - on_timeout
      description: All command arguments and public_env values must be non-sensitive.
        This version stores these inputs in the private operation request in plaintext;
        it does not accept secrets or secret references. Parameters are excluded from
        GET, audit and event bodies.
      properties:
        argv:
          type: array
          minItems: 1
          maxItems: 64
          items:
            type: string
            pattern: "^[^\\u0000]*$"
          description: Executable followed by arguments; argv[0] must be nonempty.
            No implicit shell. Total encoded runner input must fit 65536 bytes.
        public_env:
          type: object
          maxProperties: 64
          propertyNames:
            type: string
            pattern: "^(?!SANDBOX_)(?!PATH$|HOME$|TMPDIR$)[A-Za-z_][A-Za-z0-9_]{0,127}$"
          additionalProperties:
            type: string
            maxLength: 4096
            pattern: "^[^\\u0000]*$"
          description: Explicitly non-sensitive environment values only. Duplicate
            names are rejected. Values are limited to 4096 UTF-8 bytes each and the
            environment to 16384 bytes including names/separators. PATH, HOME, TMPDIR
            and SANDBOX_* are reserved.
        cwd:
          type: string
          pattern: "^/workspace(?:/.*)?$"
          description: Absolute directory under /workspace; parent components and
            NUL are rejected. The runner later opens each component without following
            symlinks.
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          description: Deadline starts at API acceptance, including queue time. Requested
            deadline must fit the current compute lease. It starts forced termination;
            it is not a promise of physical termination during a partition.
        output_limit_bytes:
          type: integer
          minimum: 0
          maximum: 16777216
        client_reference:
          anyOf:
          - type: string
            maxLength: 128
            description: At most 128 UTF-8 bytes and no control characters.
          - type: 'null'
        on_timeout:
          type: string
          enum:
          - HARD_STOP_INSTANCE
          description: Required explicit authorization for whole-instance termination
            at the accepted execution deadline; requires instances:hard_stop in addition
            to executions:create.
    CancelExecution:
      type: object
      additionalProperties: false
      required:
      - hard_stop_instance
      properties:
        hard_stop_instance:
          type: boolean
          const: true
          description: Required acknowledgement that cancellation stops the entire
            instance and retains its workspace.
    ExecutionResultRef:
      type: object
      additionalProperties: false
      required:
      - object_key
      - sha256
      - size_bytes
      properties:
        object_key:
          type: string
          maxLength: 512
          description: Private object-store key under tenants/{tenant_id}/executions/{execution_id}/,
            validated by the API. Not a URL or a bearer credential.
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
        size_bytes:
          type: integer
          minimum: 0
          maximum: 67108864
    Execution:
      type: object
      required:
      - id
      - tenant_id
      - project_id
      - instance_id
      - operation_id
      - version
      - runtime_generation
      - status
      - slot_held
      - dispatch_attempted_at
      - deadline
      - timeout_seconds
      - termination_status
      - exit_code
      - output_status
      - result_ref
      - cancel_requested_at
      - cancel_operation_id
      - client_reference
      - created_at
      - updated_at
      - completed_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        instance_id:
          type: string
          format: uuid
        operation_id:
          type: string
          format: uuid
        version:
          type: integer
          format: int64
          minimum: 1
        runtime_generation:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - QUEUED
          - DISPATCHING
          - RUNNING
          - SUCCEEDED
          - FAILED
          - TIMED_OUT
          - CANCELLED
          - OUTCOME_UNKNOWN
        slot_held:
          type: boolean
          description: Platform activity slot. Cancellation, timeout and uncertain
            dispatch retain it until trusted VM termination; ordinary independent
            exec-process completion may release the platform activity without proving
            the VM or background processes stopped.
        dispatch_attempted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        deadline:
          type: string
          format: date-time
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 3600
        termination_status:
          type: string
          enum:
          - NOT_REQUESTED
          - PENDING
          - CONFIRMED
          - UNKNOWN
        exit_code:
          anyOf:
          - type: integer
            format: int32
          - type: 'null'
        output_status:
          type: string
          enum:
          - PENDING
          - COMPLETE
          - TRUNCATED
          - PARTIAL
          - LOST
        result_ref:
          anyOf:
          - "$ref": "#/components/schemas/ExecutionResultRef"
          - type: 'null'
        cancel_requested_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        cancel_operation_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        client_reference:
          anyOf:
          - type: string
          - type: 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      description: Execution metadata excludes argv and environment. OUTCOME_UNKNOWN
        remains unknown even after VM termination is confirmed. result_ref is null
        until a trusted output store supplies a scoped manifest. Output content uses
        the separate paginated endpoint with executions:output:read permission.
    AcceptedExecution:
      type: object
      required:
      - resource
      - operation
      - instance_id
      - instance_spec_version
      - idempotency_expires_at
      properties:
        resource:
          "$ref": "#/components/schemas/Execution"
        operation:
          "$ref": "#/components/schemas/Operation"
        instance_id:
          type: string
          format: uuid
        instance_spec_version:
          type: integer
          format: int64
          minimum: 1
        idempotency_expires_at:
          type: string
          format: date-time
    OperationRecord:
      type: object
      required:
      - id
      - tenant_id
      - project_id
      - instance_id
      - workspace_id
      - kind
      - status
      - stage
      - attempts
      - created_at
      - updated_at
      - completed_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        instance_id:
          type:
          - string
          - 'null'
          format: uuid
        workspace_id:
          type:
          - string
          - 'null'
          format: uuid
        kind:
          type: string
        status:
          type: string
        stage:
          type: string
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
    OperationRecordPage:
      type: object
      required:
      - items
      - next_cursor
      - cutoff
      properties:
        items:
          type: array
          maxItems: 100
          items:
            "$ref": "#/components/schemas/OperationRecord"
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: Opaque signed cursor; repeat identical tenant, principal, project,
            instance filter and limit. Expires 24 hours after first page; null means
            no next page.
        cutoff:
          type: string
          format: date-time
    EventStreamCheckpoint:
      type: object
      required: [sequence]
      properties:
        sequence:
          type: string
          pattern: '^(0|[1-9][0-9]{0,18})$'
          description: Decimal signed-64-bit position; retain as string or BigInt.
    EventStreamDomainEvent:
      type: object
      required: [sequence, event]
      properties:
        sequence:
          type: string
          pattern: '^[1-9][0-9]{0,18}$'
          description: Commit-ordered project position, at most 9223372036854775807.
        event:
          "$ref": "#/components/schemas/EventRecord"
    EventStreamFailure:
      type: object
      required: [code, retryable, request_id]
      properties:
        code:
          type: string
          description: Fixed public API error code; never provider or guest text.
        retryable:
          type: boolean
        request_id:
          type: string
          format: uuid
    EventRecord:
      type: object
      required:
      - id
      - tenant_id
      - project_id
      - aggregate_id
      - aggregate_version
      - event_type
      - schema_version
      - operation_id
      - request_id
      - occurred_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        aggregate_id:
          type: string
          format: uuid
        aggregate_version:
          type: integer
          format: int64
          minimum: 1
        event_type:
          type: string
        schema_version:
          type: integer
          minimum: 1
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
        request_id:
          type: string
          format: uuid
        occurred_at:
          type: string
          format: date-time
    EventRecordPage:
      type: object
      required:
      - items
      - next_cursor
      - cutoff
      properties:
        items:
          type: array
          maxItems: 100
          items:
            "$ref": "#/components/schemas/EventRecord"
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: Opaque signed cursor; repeat identical tenant, principal, project,
            instance filter and limit. Expires 24 hours after first page; null means
            no next page.
        cutoff:
          type: string
          format: date-time
    AuditRecord:
      type: object
      required:
      - id
      - tenant_id
      - project_id
      - actor_principal_id
      - request_id
      - operation_id
      - resource_id
      - action
      - outcome
      - occurred_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        actor_principal_id:
          type:
          - string
          - 'null'
          format: uuid
        request_id:
          type: string
          format: uuid
        operation_id:
          type:
          - string
          - 'null'
          format: uuid
        resource_id:
          type:
          - string
          - 'null'
          format: uuid
        action:
          type: string
        outcome:
          type: string
          enum:
          - ACCEPTED
          - DENIED
          - SUCCEEDED
          - FAILED
          - UNKNOWN
        occurred_at:
          type: string
          format: date-time
    AuditRecordPage:
      type: object
      required:
      - items
      - next_cursor
      - cutoff
      properties:
        items:
          type: array
          maxItems: 100
          items:
            "$ref": "#/components/schemas/AuditRecord"
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: Opaque signed cursor; repeat identical tenant, principal, project,
            instance filter and limit. Expires 24 hours after first page; null means
            no next page.
        cutoff:
          type: string
          format: date-time
    TenantAuditRecord:
      type: object
      additionalProperties: false
      required: [id, tenant_id, project_id, actor_principal_id, request_id, operation_id, resource_id, action, outcome, occurred_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        project_id:
          type: 'null'
          description: Always null; project audit records are excluded.
        actor_principal_id: { type: [string, 'null'], format: uuid }
        request_id: { type: string, format: uuid }
        operation_id: { type: [string, 'null'], format: uuid }
        resource_id: { type: [string, 'null'], format: uuid }
        action: { type: string }
        outcome: { type: string, enum: [ACCEPTED, DENIED, SUCCEEDED, FAILED, UNKNOWN] }
        occurred_at: { type: string, format: date-time }
    TenantAuditRecordPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, cutoff]
      properties:
        items:
          type: array
          maxItems: 100
          items: { "$ref": "#/components/schemas/TenantAuditRecord" }
        next_cursor:
          type: [string, 'null']
          maxLength: 2048
          description: Opaque signed tenant/principal/action/limit-bound cursor; expires after 24 hours.
        cutoff: { type: string, format: date-time }
    RuntimeMetric:
      type: string
      enum: [VM_CPU_CORES, VM_MEMORY_BYTES, VM_IO_READ_BYTES_PER_SECOND, VM_IO_WRITE_BYTES_PER_SECOND, VM_TASKS]
    MetricPoint:
      type: object
      required: [evaluated_at, observed_at, value, status, collector_replica]
      properties:
        evaluated_at: { type: string, format: date-time }
        observed_at: { type: [string, 'null'], format: date-time }
        value: { type: [number, 'null'], minimum: 0 }
        status: { type: string, enum: [FRESH, STALE, MISSING] }
        collector_replica: { type: [string, 'null'], maxLength: 63 }
    MetricSeries:
      type: object
      required: [metric, unit, source, stale_after_seconds, points]
      properties:
        metric: { "$ref": "#/components/schemas/RuntimeMetric" }
        unit: { type: string, enum: [cores, bytes, bytes_per_second, tasks] }
        source: { type: string, enum: [HOST_VM_RUNTIME] }
        stale_after_seconds: { type: integer, const: 60 }
        points:
          type: array
          maxItems: 1441
          items: { "$ref": "#/components/schemas/MetricPoint" }
    InstanceMetricResult:
      type: object
      required: [instance_id, generation, launch_id, cluster_epoch, queried_at, series]
      properties:
        instance_id: { type: string, format: uuid }
        generation: { type: integer, minimum: 1 }
        launch_id: { type: string, format: uuid }
        cluster_epoch: { type: string, format: uuid }
        queried_at: { type: string, format: date-time }
        series: { "$ref": "#/components/schemas/MetricSeries" }
    PublicOperationError:
      type: object
      additionalProperties: false
      required:
      - code
      - retryable
      description: Sanitized fixed error classification. Raw messages, provider/guest
        errors and unknown fields are withheld on current reads and historical receipt
        replay. retryable only describes querying/reconciling the existing operation;
        it never authorizes resending a command with a new idempotency key.
      properties:
        code:
          type: string
          enum:
          - DEPENDENCY_UNAVAILABLE
          - OUTCOME_UNKNOWN
          - OPERATION_FAILED
        retryable:
          type: boolean
          description: True only for DEPENDENCY_UNAVAILABLE. UNKNOWN outcomes never
            authorize automatic execution replay.
    ApiFeatures:
      type: object
      required:
      - instance_lifecycle
      - execution_acceptance
      - execution_metadata
      - execution_hard_cancellation
      - operation_history
      - domain_event_history
      - audit_history
      - file_transfer
      - terminal_sessions
      - execution_output_download
      - execution_output_streaming
      - monitoring
      - runtime_metrics
      - control_plane_diagnoses
      - health_diagnostics
      - scheduled_tasks
      - event_automation
      - automation_notifications
      - backup_restore
      - instance_details
      - instance_security
      - project_grants
      - service_client_registry
      properties:
        instance_lifecycle:
          type: boolean
        execution_acceptance:
          type: boolean
        execution_metadata:
          type: boolean
        execution_hard_cancellation:
          type: boolean
        operation_history:
          type: boolean
        domain_event_history:
          type: boolean
        audit_history:
          type: boolean
        file_transfer:
          type: boolean
        terminal_sessions:
          type: boolean
        execution_output_download:
          type: boolean
          description: Bounded verified output pagination is implemented and a separate
            read-only object-store identity is configured. This does not assert live
            dependency health or grant output permission to the caller.
        execution_output_streaming:
          type: boolean
        monitoring:
          type: boolean
        runtime_metrics:
          type: boolean
          description: Fixed runtime metrics query API and reader configuration are present.
            This does not assert backend health, data freshness, certified collector
            coverage or the availability of alerting and notifications.
        control_plane_diagnoses:
          type: boolean
          const: true
          description: Durable read-only POST /v1/instances/{id}/diagnoses and GET
            /v1/diagnoses/{id} report APIs are implemented. Each request still
            requires its live diagnoses:create or diagnoses:read and instances:read
            grants. Does not assert worker availability, guest health, repair,
            runtime isolation certification or full health_diagnostics.
        health_diagnostics:
          type: boolean
          description: Complete runtime and guest health diagnostics; remains false.
            control_plane_diagnoses describes the separately implemented report APIs.
        scheduled_tasks:
          type: boolean
          description: Checked formal automation API routes are enabled for finite UTC schedules.
            Does not assert independent worker availability or runtime certification.
        event_automation:
          type: boolean
          description: Checked formal automation API routes are enabled for bounded event rules.
            Live delegation and business authority are rechecked for every occurrence;
            does not assert independent worker availability or notification delivery.
        automation_notifications:
          type: boolean
          description: Checked automation routes and formal migration 0042 expose a
            durable project inbox for historical FAILED and OUTCOME_UNKNOWN run facts.
            Does not assert current run resolution, caller permission, worker health
            or external notification delivery.
        backup_restore:
          type: boolean
        instance_security:
          type: boolean
          const: true
          description: Scoped security evidence read API, not runtime isolation certification.
        instance_details:
          type: boolean
        project_grants:
          type: boolean
          const: true
        service_client_registry:
          type: boolean
          const: true
    CapabilityIntegerRange:
      type: object
      required:
      - minimum
      - maximum
      properties:
        minimum:
          type: integer
          format: int64
        maximum:
          type: integer
          format: int64
    CapabilityTtlLimits:
      type: object
      required:
      - minimum
      - maximum
      - configured_default
      - explicit_value_required
      properties:
        minimum:
          type: integer
          const: 60
        maximum:
          type: integer
          format: int64
          description: Minimum of API deployment and project TTL ceilings.
        configured_default:
          type: integer
          format: int64
        explicit_value_required:
          type: boolean
          description: True when the configured default exceeds the project ceiling;
            submit an explicit allowed TTL.
    FlavorCapability:
      type: object
      required:
      - name
      - cpu_millis
      - memory_mib
      properties:
        name:
          type: string
          enum:
          - cpu1-mem2
          - cpu2-mem4
          - cpu4-mem8
        cpu_millis:
          type: integer
        memory_mib:
          type: integer
    CapabilityLimits:
      type: object
      required:
      - ttl_seconds
      - workspace_gib
      - history_page_size
      - management_body_bytes
      - execution_timeout_seconds
      - execution_output_bytes_max
      - active_execution_slots_per_instance
      properties:
        ttl_seconds:
          "$ref": "#/components/schemas/CapabilityTtlLimits"
        workspace_gib:
          "$ref": "#/components/schemas/CapabilityIntegerRange"
        history_page_size:
          "$ref": "#/components/schemas/CapabilityIntegerRange"
        management_body_bytes:
          type: integer
        execution_timeout_seconds:
          "$ref": "#/components/schemas/CapabilityIntegerRange"
        execution_output_bytes_max:
          type: integer
        active_execution_slots_per_instance:
          type: integer
          const: 1
    AutomationCronContract:
      type: object
      additionalProperties: false
      required: [field_count, seconds_field, year_field, day_of_month_and_week]
      properties:
        field_count:
          type: integer
          const: 7
        seconds_field:
          type: string
          const: '0'
        year_field:
          type: string
          const: '*'
        day_of_month_and_week:
          type: string
          const: INTERSECTION
      description: Seven UTC cron fields with literal second 0 and year *. Day-of-month
        and day-of-week both constrain matching; there is no timezone or DST conversion.
    AutomationCapabilityLimits:
      type: object
      additionalProperties: false
      required: [run_budget, minimum_interval_seconds, grace_seconds, delegation_lifetime_seconds,
        live_policies_per_project, live_policies_per_tenant, name_bytes_max,
        cron_expression_bytes_max, event_type_bytes_max]
      properties:
        run_budget:
          type: object
          additionalProperties: false
          required: [minimum, maximum]
          properties:
            minimum:
              type: integer
              const: 1
            maximum:
              type: integer
              const: 10000
        minimum_interval_seconds:
          type: object
          additionalProperties: false
          required: [minimum, maximum]
          description: Required range for the EVENT cooldown only. ONCE and CRON_UTC
            also validate the supplied value against this range, but it does not
            restrict cron expression frequency or space scheduled occurrences.
          properties:
            minimum:
              type: integer
              const: 60
            maximum:
              type: integer
              const: 86400
        grace_seconds:
          type: object
          additionalProperties: false
          required: [minimum, maximum]
          properties:
            minimum:
              type: integer
              const: 1
            maximum:
              type: integer
              const: 3600
        delegation_lifetime_seconds:
          type: object
          additionalProperties: false
          required: [exclusive_minimum, maximum]
          properties:
            exclusive_minimum:
              type: integer
              const: 60
            maximum:
              type: integer
              const: 31622400
          description: Delegation must extend strictly more than 60 seconds from the
            database acceptance clock. Live authority and the selected grants may
            impose a shorter deadline; this range does not grant delegation authority.
        live_policies_per_project:
          type: integer
          const: 100
        live_policies_per_tenant:
          type: integer
          const: 1000
        name_bytes_max:
          type: integer
          const: 128
        cron_expression_bytes_max:
          type: integer
          const: 128
        event_type_bytes_max:
          type: integer
          const: 128
      description: Static acceptance ceilings, not remaining quota. String limits count
        UTF-8 bytes; authorization, target state and current policy counts are checked
        again when each request or occurrence is accepted.
    AutomationCapability:
      type: object
      additionalProperties: false
      required: [schema_version, supported_actions, supported_triggers, clock, time_zone,
        cron, missed_run_policy, skipped_runs_consume_budget, known_automated_events_retrigger,
        outcome_unknown_policy, limits, assurance]
      properties:
        schema_version:
          type: integer
          const: 1
        supported_actions:
          type: array
          minItems: 7
          maxItems: 7
          uniqueItems: true
          items:
            type: string
            enum: [START, STOP, RESTART, DELETE, RENEW, EXECUTE, BACKUP]
          description: Exact implemented action set. Discovery does not authorize the
            caller to submit any action. DELETE removes compute and preserves workspace data.
        supported_triggers:
          type: array
          minItems: 3
          maxItems: 3
          uniqueItems: true
          items:
            type: string
            enum: [ONCE, CRON_UTC, EVENT]
        clock:
          type: string
          const: POSTGRESQL
        time_zone:
          type: string
          const: UTC
        cron:
          $ref: '#/components/schemas/AutomationCronContract'
        missed_run_policy:
          type: string
          const: AT_MOST_ONE_WITHIN_GRACE_ELSE_SKIP_SPAN
        skipped_runs_consume_budget:
          type: boolean
          const: true
        known_automated_events_retrigger:
          type: boolean
          const: false
        outcome_unknown_policy:
          type: string
          const: RECONCILE_ORIGINAL_ONLY
          description: Reconcile the exact persisted run and original business request;
            an ambiguous result never authorizes a replacement execution or new key.
        limits:
          $ref: '#/components/schemas/AutomationCapabilityLimits'
        assurance:
          type: string
          const: API_CONTRACT_ONLY
      description: Versioned contract of checked, enabled automation API routes. It
        does not assert caller permissions, available quota, worker health, delivery
        completion or cloud runtime certification. Live authority is rechecked for
        each occurrence. Capability discovery itself submits no automation.
    Capabilities:
      type: object
      required:
      - api_version
      - build_version
      - project_id
      - api_features
      - flavors
      - limits
      - runtime_certification
      - automation
      properties:
        api_version:
          type: string
          const: v1
        build_version:
          type: string
        project_id:
          type: string
          format: uuid
        api_features:
          "$ref": "#/components/schemas/ApiFeatures"
        automation:
          oneOf:
          - $ref: '#/components/schemas/AutomationCapability'
          - type: 'null'
          description: Always present. Null means checked automation API routes are
            disabled; the object advertises their contract when enabled, not independent
            worker availability or caller authority.
        flavors:
          type: array
          items:
            "$ref": "#/components/schemas/FlavorCapability"
        limits:
          "$ref": "#/components/schemas/CapabilityLimits"
        runtime_certification:
          type: string
          const: NOT_ASSERTED
          description: The capability endpoint does not attest current health, capacity,
            isolation or remote command execution.
    Workspace:
