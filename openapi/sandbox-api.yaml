  /auth/login:
    post:
      tags:
      - BrowserIdentity
      operationId: beginBrowserLogin
      summary: Begin tenant-bound confidential Code+PKCE login
      security: []
      description: Available only when BFF configuration and formal migration 0037 are
        installed. No bearer credential. Sets a 5 minute Secure/HttpOnly/Lax browser-binding
        cookie. Navigate to the returned fixed-provider URL. Login does not create or
        merge a product account.
      parameters:
      - name: Origin
        in: header
        required: true
        schema:
          type: string
          format: uri
        description: Exact configured HTTPS console origin; no inferred Host or forwarded
          origin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrowserLoginRequest'
      responses:
        '200':
          description: Browser login challenge accepted
          headers:
