  "/v1/tenant-audit-records":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    get:
      tags: [Audit]
      operationId: listTenantAuditRecords
      summary: List tenant account audit records
      description: |
        Requires a tenant-wide tenant_audit:read grant (or an existing
        tenant-wide wildcard grant) and the
        matching OAuth action scope when action scopes are enabled. Project
        grants, including project *, do not grant this permission. Every page
        checks the current enabled tenant, principal, membership, identity,
        grant and token expiry. Missing tenant authorization returns 404;
        missing OAuth action scope returns 403 INSUFFICIENT_SCOPE.

        Returns only this tenant's records whose project_id is null. Project
        records remain exclusively in /v1/audit-records. Arbitrary audit details,
        identity subjects, client credentials and mutation bodies are withheld.
        Results are ordered newest first by occurred_at then UUID. Repeat the
        same tenant, principal and limit with next_cursor. Cursors are signed,
        expire after 24 hours and never replace current authorization. Tampered,
        expired or mismatched cursors return 400 INVALID_CURSOR. Project and
        instance filters are not supported.

        cutoff fixes the initial time upper bound, not a repeatable-read
        snapshot. Late commits and retention can change membership across pages.
      parameters:
      - name: limit
        in: query
        schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      - name: cursor
        in: query
        schema: { type: string, maxLength: 2048 }
      responses:
        '200':
          description: Authorized tenant account audit page
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/TenantAuditRecordPage" }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '401': { "$ref": "#/components/responses/Unauthenticated" }
        '403': { "$ref": "#/components/responses/Forbidden" }
        '404': { "$ref": "#/components/responses/NotFound" }
        '503': { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
  "/v1/capabilities":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    get:
      tags:
      - Capabilities
      operationId: getCapabilities
      summary: Read implemented API capabilities and configured project limits
      description: Requires capabilities:read and a live enabled tenant, principal,
        project and grant. Unknown/inaccessible project returns 404. Features describe
        the implemented public API, not the caller's authorization for each mutation.
        Runtime isolation certification, current capacity, available quota, template
        approval and health are not asserted. Execution acceptance does not prove
        remote execution. Unsupported file transfer, sessions, output delivery, monitoring,
        full health diagnostics and backup capabilities remain false. The required
        automation key is null when checked automation API routes are disabled;
        otherwise it describes their versioned actions, UTC trigger semantics and
        static acceptance limits. It does not grant business permissions, report
        remaining policy quota or assert independent worker availability. Delegation
        authority can impose a shorter lifetime than the advertised maximum.
        control_plane_diagnoses advertises durable read-only report creation and reads;
        it does not grant diagnoses:create, diagnoses:read or instances:read, or
        assert guest health, repair or runtime certification. The TTL maximum is the
        smaller of deployment and project limits; if the configured default exceeds
        it, submit an explicit allowed TTL.
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Authorized capability contract
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Capabilities"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: 'PROJECT_CONFIGURATION_INVALID: configured compute lease bounds
            are invalid'
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
