---
openapi: 3.1.0
info:
  title: Sandbox Platform Control API
  version: 0.1.0
  description: |
    Contract for the routes implemented in this build. The API durably accepts lifecycle operations. A 202 receipt does not mean that
    a VM exists, is ready, or has stopped. Query the operation and observed state.
    Runtime metric queries require a configured reader. Cold backup endpoints require an independently certified and enabled profile; their presence does not declare production capability. File endpoints and browser identity require their optional configuration and formal database migrations. Automation APIs require formal migration 0039 and their dedicated grants; execution requires the independent worker. Interactive terminal sessions, alerting and restore remain unavailable until their full delivery paths are enabled.

    Protected requests require an RS256 OAuth access token with sandbox-api
    audience (deployment configurable), the configured required scopes (default
    sandbox:access), and a current product database principal/grant. X-Tenant-ID
    selects an authorized tenant context; it does not establish membership.
    Supported token profiles are RFC 9068 at+jwt with client_id/jti, or Keycloak
    JWT with signed typ=Bearer and azp. ID tokens are rejected.

    Management JSON bodies are limited to 65536 bytes and requests to 20 seconds. File data parts use a separate 1 MiB body limit; download bodies require complete length and SHA verification. Browser authentication is an optional confidential Code+PKCE flow; cookie API mutations additionally require exact Origin and X-CSRF-Token.
    The events SSE body has its own 300-second maximum connection lifetime.
    Body and path/query validation may reject before authentication. Every
    response has a server-generated X-Request-ID, Cache-Control: no-store and
    X-Content-Type-Options: nosniff. Caller request IDs are not used as audit IDs.
    Clients should tolerate new response fields and send only documented request
    fields. JSON schema errors use 422, malformed JSON uses 400, and a missing or
    unsupported JSON content type uses 415.

    Execution routes implement durable acceptance, metadata reads, verified output pages and strong cancellation. The gateway uses a single admitted Kubernetes exec connection. A 202 execution receipt is not evidence that a command ran; an unknown outcome is never automatically re-executed.
servers:
- url: "/"
security:
- bearerAuth: []
tags:
- name: Health
- name: Instances
- name: Operations
- name: Executions
- name: Events
- name: Audit
- name: Capabilities
- name: Grants
- name: ServiceClients
- name: Workspaces
- name: Files
- name: BrowserIdentity
paths:
  "/health/live":
    get:
      tags:
      - Health
      operationId: getLiveness
      summary: Check that the API process is serving requests
      description: Does not contact the database or identity provider.
      security: []
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        default:
          "$ref": "#/components/responses/Problem"
  "/health/ready":
    get:
      tags:
      - Health
      operationId: getReadiness
      summary: Check database query availability
      description: Checks that the database responds and its platform_configuration
        singleton exists. Before initialization returns 503 PLATFORM_NOT_INITIALIZED.
        Safe mode still returns 204 because querying and safety stopping must remain
        available. This is not a runtime-node, identity-provider, continuous health
        or VM readiness check.
      security: []
      responses:
        '204':
          "$ref": "#/components/responses/NoContent"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
  "/v1/instances":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    get:
      tags:
      - Instances
      operationId: listInstances
      summary: List instances in an authorized project
      description: |
        Requires instances:read. Ascending UUID keyset pagination uses after
        and next_after. This is not a creation-time ordering or a snapshot of
        concurrent changes. Keep tenant and project unchanged while paginating.
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        schema:
          type: integer
          format: int64
          minimum: 1
          maximum: 100
          default: 50
      - name: after
        in: query
        description: Last instance UUID from the previous page's next_after.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: A page of authorized instances
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Content-Type-Options:
              "$ref": "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/InstanceList"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
    post:
      tags:
      - Instances
      operationId: createInstance
      summary: Durably accept an instance creation request
      description: |
        Requires instances:create and an authorized project, approved template
        and security policy versions, configured runtime placement/storage and
        tenant/project quota budgets. Safe recovery mode rejects compute writes.

        Idempotency scope is tenant + principal + instances:create + project +
        key. The same key and parsed request return the original receipt without
        creating another resource; a changed request returns 409
        IDEMPOTENCY_CONFLICT. Receipt retention is at least seven days and extends
        while its operation is active. An expired retained key returns 410
        IDEMPOTENCY_EXPIRED. Persist operation/resource IDs and do not automatically
        replace a key after an ambiguous timeout, 503 or expired receipt. A retry
        still requires current authorization.

        Root filesystems are template based. Creation allocates a distinct
        persistent workspace. If-Match is not used for creation. Query the operation and observed state before using the instance.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateInstance"
      responses:
        '202':
          description: Intent, resource, quota reservation, operation and audit committed
          headers:
            Location:
              description: Relative operation query URL
              schema:
                type: string
                example: "/v1/operations/00000000-0000-4000-8000-000000000001"
            ETag:
              "$ref": "#/components/headers/SpecETag"
            Retry-After:
              description: Suggested delay in seconds before checking the operation
              schema:
                type: string
                const: '2'
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Content-Type-Options:
              "$ref": "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Accepted"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '409':
          description: |
            IDEMPOTENCY_CONFLICT, PROJECT_NOT_PROVISIONED, QUOTA_NOT_CONFIGURED,
            QUOTA_EXCEEDED, or a lease/domain conflict. Do not blindly change
            the idempotency key to bypass a conflict.
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '410':
          description: Retained idempotency key has expired; reconcile the original
            operation
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '413':
          description: JSON body exceeds 65536 bytes
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '415':
          description: Content-Type is missing or is not JSON
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: JSON fields/types do not match the endpoint request schema.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
  "/v1/instances/{id}":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    get:
      tags:
      - Instances
      operationId: getInstance
      summary: Query an instance's intended and observed state
      description: |
        Requires instances:read for its project. observed_at may be null when
        no runtime observation exists. desired_state=RUNNING alone does not
        imply that the instance is usable. ETag covers spec_version.
      responses:
        '200':
          description: Instance record
          headers:
            ETag:
              "$ref": "#/components/headers/SpecETag"
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Content-Type-Options:
              "$ref": "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Instance"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
    delete:
      tags:
      - Instances
      operationId: deleteInstance
      summary: delete Instance
      description: Requires instances:delete and instances:hard_stop, including idempotent
        replay and instances with an empty activity slot. This version terminates
        the entire VM when a launch was authorized and has no separately verified graceful-only path.
        It can atomically supersede an active CREATE or START and invalidate that operation's lease.
        A same-generation safety STOP can be superseded only when the instance has a verified birth
        contract and has neither a launch permit nor an active execution slot; other active operations
        still conflict. A generation that was never authorized to launch requires its independent,
        durable closure proof before compute reservations can be released. Submit no
        request body or JSON content type. Requests coordinated removal of compute/instance
        resources and retains the independent workspace; it does not grant workspaces:delete
        or delete stored data. Reusing the original idempotency key retrieves the
        accepted receipt. Requires the corresponding instances action grant. Persist
        and reuse the same Idempotency-Key, body and If-Match after an ambiguous result;
        accepted changes advance spec_version. Idempotency is scoped to tenant/principal/action/instance.
        Accepting stop/delete never proves termination, releases an activity slot,
        or authorizes deletion of the workspace.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/IfMatch"
      responses:
        '202':
          "$ref": "#/components/responses/AcceptedMutation"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: State, active operation, activity, lease, policy, quota or
            idempotency conflict; inspect the stable error code.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '410':
          description: Retained idempotency key has expired; reconcile the original
            operation
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '412':
          "$ref": "#/components/responses/VersionMismatch"
        '428':
          "$ref": "#/components/responses/PreconditionRequired"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
  "/v1/operations/{id}":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    get:
      tags:
      - Operations
      operationId: getOperation
      summary: Query an asynchronous operation
      description: |
        Requires operations:read for its project. A successfully queried FAILED
        operation still returns HTTP 200; its error is in the operation record.
        Polling or client wait timeouts do not cancel the operation.
      responses:
        '200':
          description: Operation record
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
            Cache-Control:
              "$ref": "#/components/headers/NoStore"
            X-Content-Type-Options:
              "$ref": "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Operation"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
  "/v1/instances/{id}/metrics":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    get:
      tags: [Instances]
      operationId: getInstanceMetrics
      summary: Query bounded host VM accounting for one authorized launch
      description: |
        Requires instances:read, checked before and after backend I/O. Uses only
        an immutable database launch/node binding in the current platform epoch.
        launch_id selects history; omission selects the current launch and rejects
        a change during I/O. Unknown query fields and duplicate fields are rejected.
        No user PromQL, label selector, endpoint or cloud credential is accepted.
        Ranges are limited to the last 90 days, at most 7 days and 1441 points.
        Querying retained history also depends on the backend retention policy.

        Counters use a fixed two-minute rate. CPU includes host VM overhead;
        memory is cgroup memory.current including cache; tasks counts host threads;
        I/O sums host cgroup device counters, not workspace file sizes. Source
        HOST_VM_RUNTIME is not guest application health or evidence of termination.
        Per point, select one fresh HA collector without adding duplicate series.
        A sample over 60 seconds old at evaluation time is STALE and value null;
        absent or insufficient warmup samples are MISSING and value null. Real
        measured zero remains zero. observed_at is the raw sample timestamp.
      parameters:
      - name: metric
        in: query
        required: true
        schema: { "$ref": "#/components/schemas/RuntimeMetric" }
      - name: start
        in: query
        required: true
        schema: { type: string, format: date-time }
      - name: end
        in: query
        required: true
        schema: { type: string, format: date-time }
      - name: step_seconds
        in: query
        required: true
        schema: { type: integer, minimum: 15, maximum: 3600 }
      - name: launch_id
        in: query
        required: false
        schema: { type: string, format: uuid }
      responses:
        '200':
          description: Exact launch identity and bounded metric points
          content:
            application/json:
              schema: { "$ref": "#/components/schemas/InstanceMetricResult" }
        '400': { "$ref": "#/components/responses/BadRequest" }
        '401': { "$ref": "#/components/responses/Unauthenticated" }
        '404': { "$ref": "#/components/responses/NotFound" }
        '409':
          description: METRICS_RUNTIME_UNBOUND or METRICS_RUNTIME_CHANGED; select the launch again
          content:
            application/problem+json:
              schema: { "$ref": "#/components/schemas/Problem" }
        '502':
          description: METRICS_RESPONSE_INVALID; no partial or foreign data is returned
          content:
            application/problem+json:
              schema: { "$ref": "#/components/schemas/Problem" }
        '503': { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
  "/v1/instances/{id}/actions/start":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    post:
      tags:
      - Instances
      operationId: startInstance
      summary: start Instance
      description: Requires instances:start and both desired/observed STOPPED, an
        available workspace and no activity/conflicting operation. It creates a new
        compute lease and runtime generation, rechecks template/security approval
        and reserves compute quota. Safe mode blocks starting compute. Requires the
        corresponding instances action grant. Persist and reuse the same Idempotency-Key,
        body and If-Match after an ambiguous result; accepted changes advance spec_version.
        Idempotency is scoped to tenant/principal/action/instance. Accepting stop/delete
        never proves termination, releases an activity slot, or authorizes deletion
        of the workspace.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/IfMatch"
      responses:
        '202':
          "$ref": "#/components/responses/AcceptedMutation"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: State, active operation, activity, lease, policy, quota or
            idempotency conflict; inspect the stable error code.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '410':
          description: Retained idempotency key has expired; reconcile the original
            operation
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '412':
          "$ref": "#/components/responses/VersionMismatch"
        '428':
          "$ref": "#/components/responses/PreconditionRequired"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
        '413':
          description: JSON body exceeds 65536 bytes
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '415':
          description: Content-Type is missing or is not JSON
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: JSON fields/types do not match the endpoint request schema.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/StartInstance"
  "/v1/instances/{id}/actions/stop":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    post:
      tags:
      - Instances
      operationId: stopInstance
      summary: stop Instance
      description: Requires instances:stop and instances:hard_stop, including idempotent
        replay and instances with an empty activity slot. This version terminates
        the entire VM and has no separately verified graceful-only path. Requests
        coordinated termination while preserving the workspace. A stop may supersede
        an active CREATE/START/RESTART for safety; the cancelled older operation does
        not prove that its in-flight runtime effects have stopped. Safe mode does
        not prevent safety stop. Requires the corresponding instances action grant.
        Persist and reuse the same Idempotency-Key, body and If-Match after an ambiguous
        result; accepted changes advance spec_version. Idempotency is scoped to tenant/principal/action/instance.
        Accepting stop/delete never proves termination, releases an activity slot,
        or authorizes deletion of the workspace.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/IfMatch"
      responses:
        '202':
          "$ref": "#/components/responses/AcceptedMutation"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: State, active operation, activity, lease, policy, quota or
            idempotency conflict; inspect the stable error code.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '410':
          description: Retained idempotency key has expired; reconcile the original
            operation
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '412':
          "$ref": "#/components/responses/VersionMismatch"
        '428':
          "$ref": "#/components/responses/PreconditionRequired"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
        '413':
          description: JSON body exceeds 65536 bytes
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '415':
          description: Content-Type is missing or is not JSON
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: JSON fields/types do not match the endpoint request schema.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmptyAction"
  "/v1/instances/{id}/actions/restart":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    post:
      tags:
      - Instances
      operationId: restartInstance
      summary: restart Instance
      description: Requires instances:restart and instances:hard_stop, including idempotent
        replay and an empty activity slot. It terminates the whole VM; no separately
        verified graceful-only path exists. Requires an admitted RUNNING instance
        and no conflicting activity/operation. The existing compute lease and expiry
        are preserved; this action does not grant extra runtime. New generation changes
        follow confirmed termination. Safe mode blocks restart. Requires the corresponding
        instances action grant. Persist and reuse the same Idempotency-Key, body and
        If-Match after an ambiguous result; accepted changes advance spec_version.
        Idempotency is scoped to tenant/principal/action/instance. Accepting stop/delete
        never proves termination, releases an activity slot, or authorizes deletion
        of the workspace.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/IfMatch"
      responses:
        '202':
          "$ref": "#/components/responses/AcceptedMutation"
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
          "$ref": "#/components/responses/Unauthenticated"
        '403':
          "$ref": "#/components/responses/Forbidden"
        '404':
          "$ref": "#/components/responses/NotFound"
        '409':
          description: State, active operation, activity, lease, policy, quota or
            idempotency conflict; inspect the stable error code.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '410':
          description: Retained idempotency key has expired; reconcile the original
            operation
          headers:
            X-Request-ID:
              "$ref": "#/components/headers/RequestId"
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '412':
          "$ref": "#/components/responses/VersionMismatch"
        '428':
          "$ref": "#/components/responses/PreconditionRequired"
        '503':
          "$ref": "#/components/responses/Unavailable"
        default:
          "$ref": "#/components/responses/Problem"
        '413':
          description: JSON body exceeds 65536 bytes
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '415':
          description: Content-Type is missing or is not JSON
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '422':
          description: JSON fields/types do not match the endpoint request schema.
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EmptyAction"
  "/v1/instances/{id}/actions/renew":
    parameters:
    - "$ref": "#/components/parameters/TenantId"
    - "$ref": "#/components/parameters/ResourceId"
    post:
      tags:
      - Instances
      operationId: renewInstance
      summary: renew Instance
      description: Requires instances:renew. Extends the existing unexpired compute
        lease to an absolute expires_at. It cannot undo accepted stop/expiry. A CREATE
        or START may remain active while renewal commits; other active lifecycle operations
        conflict. Safe mode blocks renewal. An assigned node must have a current operator
        certification covering the requested expires_at; otherwise the request returns
        409 CERTIFICATION_LEASE_LIMIT. A RUNNING instance without a registered launch
        also fails closed; an unassigned pending instance may renew. The response is HTTP 200 with a synchronously
        SUCCEEDED RENEW operation, not a 202 queued VM change. Requires the corresponding
        instances action grant. Persist and reuse the same Idempotency-Key, body and
        If-Match after an ambiguous result; accepted changes advance spec_version.
        Idempotency is scoped to tenant/principal/action/instance. Accepting stop/delete
        never proves termination, releases an activity slot, or authorizes deletion
        of the workspace.
      parameters:
      - "$ref": "#/components/parameters/IdempotencyKey"
      - "$ref": "#/components/parameters/IfMatch"
      responses:
        '400':
          "$ref": "#/components/responses/BadRequest"
        '401':
