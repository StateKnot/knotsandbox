        expected_resource_version:
          type: integer
          format: int64
          minimum: 1
        expected_generation:
          type: integer
          format: int64
          minimum: 0
        status:
          type: string
          enum:
          - PENDING
          - CLAIMED
          - DISPATCHING
          - SUBMITTED
          - SUCCEEDED
          - FAILED
          - SKIPPED
          - CANCELLED
          - OUTCOME_UNKNOWN
        operation_id:
          type: string
          format: uuid
          nullable: true
        failure_code:
          type: string
          nullable: true
        deadline:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - tenant_id
      - project_id
      - automation_id
      - version
      - automation_version
      - scheduled_for
      - source_event_id
      - source_event_sequence
      - skipped_through
      - operation_kind
      - expected_resource_version
      - expected_generation
      - status
      - operation_id
      - failure_code
      - deadline
      - created_at
      - updated_at
      - completed_at
      description: Persistent original intent. SUBMITTED is accepted, not physically complete. OUTCOME_UNKNOWN
        blocks later runs. Reconcile the same run, without replacement work. History excludes commands, tokens,
        management keys and claims.
    AutomationReceipt:
      type: object
      additionalProperties: false
      properties:
        resource:
          $ref: '#/components/schemas/Automation'
        idempotency_expires_at:
          type: string
          format: date-time
      required:
      - resource
      - idempotency_expires_at
    AutomationPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Automation'
        next_cursor:
          type: string
          nullable: true
        cutoff:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - cutoff
    AutomationRunPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AutomationRun'
        next_cursor:
          type: string
          nullable: true
        cutoff:
          type: string
          format: date-time
      required:
      - items
      - next_cursor
      - cutoff
    AutomationEmptyAction:
      type: object
      additionalProperties: false
      properties: {}
    AutomationNotification:
      type: object
      additionalProperties: false
      description: Fixed metadata for one immutable historical FAILED or OUTCOME_UNKNOWN
        run fact. Source status is retained even if the original run later changes.
        Acknowledgement records management attention and never proves resolution.
        Commands, source event payloads, internal errors and issuer/subject identities
        are excluded.
      required:
      - id
      - tenant_id
      - project_id
      - instance_id
      - automation_id
      - run_id
      - source_event_id
      - source_run_version
      - source_status
      - created_at
      - acknowledged_at
      - acknowledged_by
      - version
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        instance_id: {type: string, format: uuid}
        automation_id: {type: string, format: uuid}
        run_id: {type: string, format: uuid}
        source_event_id: {type: string, format: uuid}
        source_run_version: {type: integer, format: int64, minimum: 1}
        source_status: {type: string, enum: [FAILED, OUTCOME_UNKNOWN]}
        created_at:
          type: string
          format: date-time
          pattern: '(Z|\+00:00)$'
          description: UTC time when this historical fact was persisted.
        acknowledged_at:
          type: [string, 'null']
          format: date-time
          pattern: '(Z|\+00:00)$'
          description: UTC acknowledgement time, or null before acknowledgement.
        acknowledged_by: {type: [string, 'null'], format: uuid}
        version: {type: integer, format: int64, minimum: 1}
    AutomationNotificationPage:
      type: object
      additionalProperties: false
      required: [items, next_cursor, cutoff]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AutomationNotification'}
        next_cursor: {type: [string, 'null']}
        cutoff:
          type: string
          format: date-time
          description: Database-clock cutoff preserved by the signed continuation cursor.
    AutomationNotificationReceipt:
      type: object
      additionalProperties: false
      required: [resource, idempotency_expires_at]
      properties:
        resource: {$ref: '#/components/schemas/AutomationNotification'}
        idempotency_expires_at: {type: string, format: date-time}
    SecurityPolicyBinding:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      - version
      - status
      - document_status
      - rules_sha256
      - profile
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 256
        version:
          type: integer
          format: int64
          minimum: 1
        status:
          type: string
          enum:
          - DRAFT
          - APPROVED
          - REVOKED
        document_status:
          type: string
          enum:
          - AVAILABLE
          - UNAVAILABLE
        rules_sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        profile:
          type:
          - string
          - 'null'
          enum:
          - DENY_ALL_WITH_DNS
          - null
      description: Only the instance-bound versioned summary is disclosed. SHA-256 identifies bounded
        PostgreSQL JSONB UTF-8 text with exact stored numeric values. It is not RFC 8785 or a
        cross-PostgreSQL-version canonical format, and is not an enforcement receipt or signature.
    DesiredRuntimeControls:
      type: object
      additionalProperties: false
      required:
      - runtime_class
      - run_as_non_root
      - user_id
      - seccomp_profile
      - privileged
      - allow_privilege_escalation
      - read_only_root_filesystem
      - host_network
      - host_pid
      - host_ipc
      - service_account_token
      - capabilities_drop
      properties:
        runtime_class:
          type: string
          const: kata-qemu
        run_as_non_root:
          type: boolean
          const: true
        user_id:
          type: integer
          const: 1000
        seccomp_profile:
          type: string
          const: RuntimeDefault
        privileged:
          type: boolean
          const: false
        allow_privilege_escalation:
          type: boolean
          const: false
        read_only_root_filesystem:
          type: boolean
          const: true
        host_network:
          type: boolean
          const: false
        host_pid:
          type: boolean
          const: false
        host_ipc:
          type: boolean
          const: false
        service_account_token:
          type: boolean
          const: false
        capabilities_drop:
          type: array
          items:
            type: string
            const: ALL
          minItems: 1
          maxItems: 1
      description: Expected controlled manifest settings. This does not assert the settings are applied in
        a running VM.
    UnknownSecurityEvidence:
      type: object
      additionalProperties: false
      required:
      - status
      - reason
      properties:
        status:
          type: string
          enum:
          - UNKNOWN
        reason:
          type: string
          enum:
          - INDEPENDENT_ENFORCEMENT_EVIDENCE_UNAVAILABLE
          - RUNTIME_ISOLATION_CERTIFICATION_UNAVAILABLE
          - IMAGE_VERIFICATION_EVIDENCE_UNAVAILABLE
    SecurityOperation:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - status
      - error
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: Durable operation category. Acceptance does not establish runtime, deletion or backup
            completion.
          enum:
          - CREATE
          - START
          - STOP
          - RESTART
          - DELETE
          - RENEW
          - EXECUTE
          - DELETE_WORKSPACE
          - BACKUP
          - DIAGNOSE
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - WAITING
          - SUCCEEDED
          - FAILED
          - CANCELLED
        error:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/PublicOperationError'
    InstanceSecurity:
      type: object
      additionalProperties: false
      required:
      - instance_id
      - project_id
      - spec_version
      - runtime_generation
      - launch_id
      - cluster_epoch
      - as_of
      - desired
      - observations
      - applied_policy
      - runtime_isolation
      - image_verification
      - findings
      - active_operation
      - denial_history
      - runtime_certification
      properties:
        instance_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        spec_version:
          type: integer
          format: int64
          minimum: 1
        runtime_generation:
          type: integer
          format: int64
          minimum: 0
        launch_id:
          type: string
          format: uuid
        cluster_epoch:
          type: string
          format: uuid
        as_of:
          type: string
          format: date-time
        desired:
          type: object
          additionalProperties: false
          required:
          - template
          - security_policy
          - resources
          - runtime_controls
          properties:
            template:
              $ref: '#/components/schemas/TemplateDetails'
            security_policy:
              $ref: '#/components/schemas/SecurityPolicyBinding'
            resources:
              type: object
              additionalProperties: false
              required:
              - cpu_millis
              - memory_mib
              properties:
                cpu_millis:
                  type: integer
                  format: int64
                  minimum: 1
                memory_mib:
                  type: integer
                  format: int64
                  minimum: 1
            runtime_controls:
              $ref: '#/components/schemas/DesiredRuntimeControls'
        observations:
          type: object
          additionalProperties: false
          required:
          - lifecycle
          - policy_object
          - launch_validation
          - node_authorization
          properties:
            lifecycle:
              $ref: '#/components/schemas/LifecycleObservation'
            policy_object:
              type: object
              additionalProperties: false
              required:
              - status
              - ledger_status
              - recorded_generation
              - observed_at
              properties:
                status:
                  type: string
                  enum:
                  - RECORDED
                  - UNAVAILABLE
                ledger_status:
                  type:
                  - string
                  - 'null'
                  maxLength: 64
                recorded_generation:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  minimum: 0
                observed_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
              description: A persisted Kubernetes object record; RECORDED does not mean the Cilium policy
                is applied or enforced.
            launch_validation:
              type: object
              additionalProperties: false
              required:
              - status
              - observed_at
              - generation
              - matches_current_launch
              - matches_current_cluster_epoch
              properties:
                status:
                  type: string
                  enum:
                  - HISTORICAL_RECORDED
                  - UNAVAILABLE
                observed_at:
                  type:
                  - string
                  - 'null'
                  format: date-time
                generation:
                  type:
                  - integer
                  - 'null'
                  format: int64
                  minimum: 0
                matches_current_launch:
                  type: boolean
                matches_current_cluster_epoch:
                  type: boolean
              description: Historical lifecycle validation only. Current matching does not certify the running
                VM or its network isolation.
            node_authorization:
              type: object
              additionalProperties: false
              required:
              - status
              - valid_until
              properties:
                status:
                  type: string
                  enum:
                  - COVERS_COMPUTE_LEASE
                  - UNAVAILABLE
                  - EXPIRED_OR_INSUFFICIENT
                valid_until:
                  type:
                  - string
                  - 'null'
                  format: date-time
              description: Control-plane node authorization window only, not evidence of current runtime enforcement.
        applied_policy:
          $ref: '#/components/schemas/UnknownSecurityEvidence'
        runtime_isolation:
          $ref: '#/components/schemas/UnknownSecurityEvidence'
        image_verification:
          $ref: '#/components/schemas/UnknownSecurityEvidence'
        findings:
          type: array
          items:
            type: string
            enum:
            - TEMPLATE_NOT_APPROVED
            - SECURITY_POLICY_NOT_APPROVED
            - POLICY_DOCUMENT_UNAVAILABLE
            - POLICY_PROFILE_UNSUPPORTED
            - HISTORICAL_CLUSTER_EPOCH
            - PLATFORM_SAFE_MODE
            - COMPUTE_LEASE_EXPIRED
            - COMPUTE_NO_LONGER_DESIRED
            - WORKSPACE_UNAVAILABLE
          maxItems: 9
          description: Current fixed guard findings. An empty list is not a clean vulnerability scan or a
            health assertion.
        active_operation:
          type: object
          additionalProperties: false
          required:
          - state
          - resource
          properties:
            state:
              type: string
              enum:
              - AVAILABLE
              - NONE
              - REDACTED
              - UNAVAILABLE
            resource:
              oneOf:
              - type: 'null'
              - $ref: '#/components/schemas/SecurityOperation'
          description: Operation summary additionally requires current operations:read. Without it state is
            REDACTED and resource is null.
        denial_history:
          type: object
          additionalProperties: false
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - NOT_CAPTURED
          description: Admission denial history is not captured by this read model; this is not zero denials.
        runtime_certification:
          type: string
          enum:
          - NOT_ASSERTED
      description: A scoped read-only control-plane security view. Desired, persisted, historical and independent
        enforcement evidence remain separate.
