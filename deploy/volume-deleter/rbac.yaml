apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-volume-deleter
  namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-volume-deleter-observe
rules:
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get]
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get, delete]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    resourceNames: [sandbox-workspace]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-volume-deleter-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-volume-deleter-observe
subjects:
  - {kind: ServiceAccount, name: sandbox-volume-deleter, namespace: sandbox-system}
---
# Render per registered project. Admission validates exact UID/ledger evidence.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-volume-deleter
  namespace: REPLACE_WITH_PROJECT_RUNTIME_NAMESPACE
rules:
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-volume-deleter
  namespace: REPLACE_WITH_PROJECT_RUNTIME_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-volume-deleter
subjects:
  - {kind: ServiceAccount, name: sandbox-volume-deleter, namespace: sandbox-system}
