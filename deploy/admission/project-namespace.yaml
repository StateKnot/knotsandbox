# Created only by the exact configured namespace-provisioner service account
# after the tenant/project/namespace row exists in PostgreSQL.
apiVersion: v1
kind: Namespace
metadata:
  name: REPLACE_WITH_PROJECT_RUNTIME_NAMESPACE
  labels:
    sandbox.platform/managed: 'true'
    sandbox.platform/tenant-id: REPLACE_WITH_TENANT_UUID
    sandbox.platform/project-id: REPLACE_WITH_PROJECT_UUID
    sandbox.platform/cluster-epoch: REPLACE_WITH_CURRENT_DATABASE_CLUSTER_EPOCH
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
  annotations:
    sandbox.platform/certification-id: REPLACE_WITH_SIGNED_G1_EVIDENCE_REFERENCE
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-default-deny
  namespace: REPLACE_WITH_PROJECT_RUNTIME_NAMESPACE
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
