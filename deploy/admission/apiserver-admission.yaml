# Mount into each kube-apiserver and pass
# --admission-control-config-file=/etc/kubernetes/sandbox-admission.yaml
apiVersion: apiserver.config.k8s.io/v1
kind: AdmissionConfiguration
plugins:
  - name: ValidatingAdmissionWebhook
    configuration:
      apiVersion: apiserver.config.k8s.io/v1
      kind: WebhookAdmissionConfiguration
      kubeConfigFile: /etc/kubernetes/sandbox-webhook-client.kubeconfig
