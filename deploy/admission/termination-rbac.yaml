# Apply only after the fail-closed webhook and exact termination SA UID are set.
# The namespaced Role/Binding must be rendered once for each registered project.
# PATCH authority is bounded by admission: only an exact proven finalizer removal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox-termination
  namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sandbox-termination-observe
rules:
  # Live inventory discovers API creates arriving after compute DELETE completed.
  # Listing is read-only; each mutation still requires namespace RBAC + proof.
  - apiGroups: ['']
    resources: [pods]
    verbs: [list]
  - apiGroups: ['']
    resources: [namespaces, nodes, persistentvolumes]
    verbs: [get]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    resourceNames: [kata-qemu]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sandbox-termination-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sandbox-termination-observe
subjects:
  - kind: ServiceAccount
    name: sandbox-termination
    namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-termination
  namespace: REPLACE_WITH_PROJECT_RUNTIME_NAMESPACE
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, delete, patch]
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    resourceNames: [sandbox-default-deny]
    verbs: [get]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sandbox-termination
  namespace: REPLACE_WITH_PROJECT_RUNTIME_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-termination
subjects:
  - kind: ServiceAccount
    name: sandbox-termination
    namespace: sandbox-system
